<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4B0082"/>
      <stop offset="100%" stop-color="#9370DB"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <style>
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes glow {
        0%, 100% { text-shadow: 0 0 10px #C724B1, 0 0 20px #C724B1, 0 0 30px #C724B1; }
        50% { text-shadow: 0 0 20px #FF00FF, 0 0 40px #FF00FF, 0 0 60px #FF00FF; }
      }

      .fade-in {
        animation: fadeIn 2s ease-in-out forwards, glow 2s infinite alternate ease-in-out;
        filter: url(#neonGlow);
      }
    </style>
  </defs>


  <rect width="900" height="300" rx="40" fill="url(#bgGradient)"/>

 
  <text x="50%" y="50%" font-size="70" fill="white" text-anchor="middle" dy=".3em" class="fade-in">
    Fillum 🎬
  </text>
</svg>
